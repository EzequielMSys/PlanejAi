<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><rect width="1080" height="640" fill="#faf9f6"/><g fill="#252331" font-family="Arial,sans-serif"><text x="56" y="66" font-size="14" letter-spacing="2">PLANEJAI / ESTUDO DE IDENTIDADE</text><text x="56" y="125" font-size="40" letter-spacing="-2">Uma ideia abre outra.</text><text x="56" y="160" font-size="16">Três construções. Uma direção aplicada ao produto.</text><path d="M56 192h968" stroke="#d8d3e1"/><text x="56" y="235" font-size="13">01 / CURVA E PONTO · ESCOLHIDA</text><g transform="translate(70 270) scale(3.2)" fill="#7353bd"><path d="M8 42V20C8 10 14 5 24 5h4c10 0 16 6 16 14S38 34 28 34h-6v-8h6c5 0 8-3 8-7s-3-6-8-6h-4c-5 0-8 3-8 8v21Z"/><circle cx="36" cy="38" r="5"/></g><text x="56" y="482" font-size="24">Continuidade</text><text x="56" y="516" font-size="14">P aberto, curva firme e ponto de descoberta.</text><text x="416" y="235" font-size="13">02 / DOBRA</text><path d="M430 430V280h75l70 70-70 80h-35v-48h30l28-31-32-30h-26v109Z" fill="#252331"/><text x="416" y="482" font-size="24">Construção</text><text x="416" y="516" font-size="14">Uma página que ganha outra direção.</text><text x="762" y="235" font-size="13">03 / ENCONTRO</text><g fill="none" stroke="#252331" stroke-width="17"><path d="M790 430V330a49 49 0 1 1 49 49h-17"/><circle cx="943" cy="420" r="9" fill="#252331" stroke="none"/></g><text x="762" y="482" font-size="24">Relação</text><text x="762" y="516" font-size="14">Dois pontos ligados por uma pergunta.</text><path d="M56 558h968" stroke="#d8d3e1"/><text x="56" y="600" font-size="13">FORMAS PRÓPRIAS / VETOR / UMA COR / SEM FONTE OU IMAGEM EXTERNA</text></g></svg>