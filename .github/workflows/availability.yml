name: Disponibilidade do PlanejAI
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node src/scripts/checkAvailability.js
      - name: Testar frontend, API, login e acesso privado na produção
        run: node src/scripts/smokeProduction.js
        env:
          PLANEJAI_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
